
<section class="new-clip">
	<style>
		#record-voice + label + div, #upload-file + label + div {
			margin-left: 1em;
			padding: .5em;
		}
		#script-select {	
			max-width: calc(100% - 6ch);
		}
		#title-input {
			max-width: calc(100% - 16ch);
		}
		section.new-clip .new-clip {
			margin-bottom: 1em;
		}
		.new-clip .hbox {
			display: flex;
			align-items: center;
		}
		.new-clip .hbox select, .hbox input[type=text] {
			width: 100%;
			flex-shrink: 1;
		}
		.new-clip .hbox label {
			margin-left: 1em;
			margin-right: .5em;
		}
		.new-clip .hbox label:first-child {
			margin-left: 0px;
		}
		.new-clip h2 {
			margin-top: 0px;
		}
		.new-clip #submit {
			float: right;
		}
		#upload-file + label + div, #record-voice + label + div {
		}
		/* Show upload/recording elements only when that option is selected. */
		#record-voice          + label + div { display: none; }
		#record-voice:checked  + label + div { display: block; }
		#upload-file           + label + div { display: none;}
		#upload-file:checked   + label + div { display: block;}
		#live-spectrogram {
			margin: .75em 0 .25em;
			--vs-height: 180px;
			--vs-axis-width: 3.6em;
		}
		#transcribe-row {
			margin-top: .4em;
		}
		#transcribe-row.hidden {
			display: none;
		}
		#transcribe-row select {
			width: auto;
			flex-grow: 1;
		}
		#transcribe-row button {
			margin-left: .5em;
		}
		#no-transcription-endpoints, #transcribe-status {
			font-size: 90%;
			margin: .3em 0;
		}
		#transcribe-status:empty {
			display: none;
		}
		#transcript-review {
			margin: .3em 0;
			padding: .4em .5em;
			border: 1px solid var(--chrome-border);
			border-radius: .3em;
			line-height: 1.6;
		}
		#transcript-review.hidden {
			display: none;
		}
		#transcript-review .check, #transcript-review .unsure {
			border-radius: .2em;
			color: inherit;
			cursor: help;
			text-decoration: underline wavy;
			text-decoration-skip-ink: none;
		}
		#transcript-review .check {
			background: rgba(255, 200, 0, .2);
			text-decoration-color: rgba(220, 160, 0, .9);
		}
		#transcript-review .unsure {
			background: rgba(255, 60, 30, .4);
			text-decoration-color: rgba(230, 50, 20, .95);
		}
		.new-clip .spectrogram-controls {
			margin-bottom: .75em;
			font-size: small;
		}
		.new-clip .spectrogram-controls label {
			margin: 0 .5em 0 0;
			white-space: nowrap;
		}
	</style>

	<h2>Add a Clip</h2>

	<div class="hbox">
		<label for="title-input">Title</label>
		<input type="text" id="title-input" value="Untitled"/>

		<label for="color-select">Color</label>
		<input type="color" id="color-select" value="#000000"/>
	</div>

	<br>

	<div class="hbox">
		<label for="tags-input">Tags</label>
		<input type="text" id="tags-input" list="tag-suggestions" placeholder="e.g. week 3, morning"/>
	</div>

	<br>

	<!-- Script selection -->
	<div class="hbox">
		<label for="script-select">Script </label>
		<select class="script" id="script-select">
			{% include 'speech-scripts.html' %}
		</select>
	</div>
	<textarea rows="6" id="transcript"></textarea>
	<script>
		globalState.render(['transcript'], current => {
			$('#transcript').value = current.transcript;
		});

		function formatTranscript(value) {
			return value.replace(/\s\s+/g, '\n').trim()
		}
		globalState.set('transcript', formatTranscript($('#script-select').value));

		$('#script-select').addEventListener('change', evt => {
			let value = $('#script-select').value;
			globalState.set('transcript',  value == 'custom' ? '' : formatTranscript(value));
		});

		$('#transcript').addEventListener('change', evt => {
			if (globalState.get('transcript') != $('#transcript').value) {
				globalState.set('transcript', $('#transcript').value);
				$('#script-select').value = 'custom';
			}
		});
	</script>

	<!-- Fill in the transcript from the recording (transcription.js). -->
	<div id="transcribe-row" class="hbox">
		<label for="transcription-endpoint">Transcribe with</label>
		<select id="transcription-endpoint"></select>
		<button id="transcribe" type="button">Transcribe</button>
	</div>
	<p id="no-transcription-endpoints">To fill in the transcript from your recording,
		<a href="#transcription-endpoints" id="open-endpoint-editor">add a transcription endpoint</a>.</p>
	<p id="transcribe-status" role="status"></p>
	<!-- The transcription again, its doubtful words marked, until the
	     transcript is edited. -->
	<p id="transcript-review" class="hidden" aria-label="Transcription, with doubtful words marked"></p>
	<script>
		globalState.render(['transcriptionEndpoints'], ({ transcriptionEndpoints }) => {
			const select = $('#transcription-endpoint');
			const chosen = chosenTranscriptionEndpoint();
			select.replaceChildren(...transcriptionEndpoints.map(endpoint => {
				const option = create('option', { value: endpoint.id });
				option.textContent = endpoint.name;
				return option;
			}));
			if (chosen) select.value = chosen.id;
			$('#transcribe-row').classList.toggle('hidden', transcriptionEndpoints.length == 0);
			$('#no-transcription-endpoints').classList.toggle('hidden', transcriptionEndpoints.length > 0);
			updateTranscribeTitle();
		});

		function updateTranscribeTitle() {
			const endpoint = chosenTranscriptionEndpoint();
			$('#transcribe').title = endpoint ? `Send the recording to ${endpointHost(endpoint)} and put its transcript above` : '';
		}

		$('#transcription-endpoint').addEventListener('change', event => {
			localSettings.set('transcriptionEndpoint', event.target.value);
			updateTranscribeTitle();
		});

		// To the editor in the settings tab; the dialog keeps what's in it.
		$('#open-endpoint-editor').addEventListener('click', event => {
			event.preventDefault();
			hideModal();
			$('.tab-set button.settings').click();
			openEndpointForm();
		});

		// The transcript the review is of; null when it's hidden.
		let reviewedTranscript = null;

		// Show the transcription with its doubtful words marked; returns
		// what to tell the user.
		function showTranscriptReview(text, words) {
			const doubtful = (words || []).filter(word => wordConfidence(word.probability) != 'sure');
			if (!doubtful.length) {
				hideTranscriptReview();
				return words ? 'check the transcript and correct anything it got wrong.'
					: "check the transcript and correct anything it got wrong (this server doesn't say which words it's unsure of).";
			}
			const review = $('#transcript-review');
			review.replaceChildren(...words.map((word, i) => {
				const confidence = wordConfidence(word.probability);
				const leading = word.text.match(/^\s*/)[0];
				const spelled = word.text.slice(leading.length);
				if (confidence == 'sure') return (i ? leading : '') + spelled;
				const mark = create('mark', { class: confidence, title: `${Math.round(word.probability * 100)}% sure` });
				mark.textContent = spelled;
				const piece = document.createDocumentFragment();
				piece.append(i ? leading : '', mark);
				return piece;
			}));
			review.classList.remove('hidden');
			reviewedTranscript = text;
			const count = doubtful.length == 1 ? '1 word it was unsure of is' : `${doubtful.length} words it was unsure of are`;
			return `${count} marked below. Check them against the recording and correct the transcript.`;
		}

		function hideTranscriptReview() {
			reviewedTranscript = null;
			$('#transcript-review').classList.add('hidden');
			$('#transcript-review').replaceChildren();
		}

		// Once the transcript is edited, the marks no longer line up with it.
		globalState.render(['transcript'], ({ transcript }) => {
			if (reviewedTranscript !== null && transcript != reviewedTranscript) hideTranscriptReview();
		});
		$('#transcript').addEventListener('input', () => {
			if (reviewedTranscript !== null && $('#transcript').value != reviewedTranscript) hideTranscriptReview();
		});

		$('#transcribe').addEventListener('click', async () => {
			const status = $('#transcribe-status');
			const endpoint = chosenTranscriptionEndpoint();
			const audio = currentRecording();
			if (!audio) {
				status.textContent = 'Record your voice or choose a file first.';
				return;
			}
			const button = $('#transcribe');
			button.disabled = true;
			hideTranscriptReview();
			status.textContent = `Transcribing with ${endpoint.name}…`;
			try {
				const { text, words } = await transcribeWith(endpoint, audio);
				if (!text) throw new TranscriptionError('The server heard no speech.');
				globalState.set('transcript', text);
				$('#script-select').value = 'custom';
				status.textContent = 'Done: ' + showTranscriptReview(text, words);
			} catch (error) {
				console.warn('Transcription failed:', error);
				status.textContent = error instanceof TranscriptionError ? error.message : `Transcription failed: ${error.message}`;
			} finally {
				button.disabled = false;
			}
		});
	</script>


	<!-- Upload Options -->
	<input type="radio" name="add-recording" id="upload-file" checked>
	<label for="upload-file">Upload a file</label>
	<div>
		<input type='file' id='audio-file-input' name='recording' 
		capture="user" accept="audio/*,video/*,audio/mpeg,audio/mp4,audio/x-aiff,audio/ogg,audio/vorbis,audio/opus,audio/vnd.wav,.wav,.mp3,.ogg,.opus,.m4a,.webm"/>
	</div>
	<br>
	<input type="radio" name="add-recording" id="record-voice">
	<label for="record-voice">Record your voice</label>
	<div>
		<button id="start-recording">⏺︎ Start</button>
		<button id="stop-recording">⏹︎ Stop</button>
		Recorded <span id="recording-count">0</span> seconds
		<!-- The microphone's spectrogram and pitch while recording
		     (components/voice-spectrogram). -->
		<voice-live-spectrogram id="live-spectrogram" frequency-scale="log" min-frequency="75" max-frequency="1000"></voice-live-spectrogram>
		<audio controls id="recording-preview"></audio>
	</div>
	<!-- Submit -->
	<button id="submit" class='attention' onclick="submitAudio()">Add Clip</button>
	<script>
	try {
		// record from their microphone in-browser,
		let mediaRecorder = null;
		let audioChunks = [];
		let recordedAudio = null;
		let recordingInterval = null;
		function recordAudio() {
			let stopButton = document.querySelector("#stop-recording");
			let startButton = document.querySelector("#start-recording");

			// The recorder's listeners are added once, when it's created:
			// adding them here, on every start, duplicated each recording's
			// audio once per earlier take.
			const startRecording = () => {
				$('#recording-count').innerHTML = '0';
				recordingInterval = setInterval(() => {
					$('#recording-count').innerHTML = Number($('#recording-count').innerHTML) + 1;
				}, 1000);
				stopButton.disabled = false;
				startButton.disabled = true;
				audioChunks = [];
				mediaRecorder.start();
				$('#live-spectrogram').clear();
				$('#live-spectrogram').stream = mediaRecorder.stream;
			}

			function alertRecordingFailure(exception) {
				alert(
					String(window.location).slice(0, 5) == 'https'
					?
						  "Sorry, something went wrong. " 
						+ "Please ensure that your microphone is connected "
						+ "and that your browser allows us to record from it. "
						+ "Alternately, you can try uploading a file recorded from a native app instead."
					:
						  "Recording in-browser is only available "
						+ "when accessing the site over a secure connection. "
						+ "To record, reload the page ensuring "
						+ "that the URL starts with 'https', "
						+ "including the 's' at the end."
				);
				console.error(exception);
			}
			if (mediaRecorder) { startRecording(); } else {
				try { 
					navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
						
						mediaRecorder = new MediaRecorder(stream);
						mediaRecorder.addEventListener("dataavailable", event => {
							audioChunks.push(event.data);
						});
						mediaRecorder.addEventListener("stop", () => {
							clearInterval(recordingInterval);
							$('#live-spectrogram').stream = null;  // the picture stays
							stopButton.disabled = true;
							startButton.disabled = false;
							const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
							recordedAudio = audioBlob;

							let reader = new FileReader(recordedAudio);	
							reader.readAsDataURL(recordedAudio);
							reader.addEventListener("load", () => {
								$('#recording-preview').src = reader.result.replace(
									/data:.*;base64/, "data:audio/wav;base64"
								);
								$('#recording-preview').load();
							});
						});
						stopButton.addEventListener("click", () => {mediaRecorder.stop();}, false);
						startRecording();
					}).catch(exception => alertRecordingFailure(exception));
				} catch(exception) { alertRecordingFailure(exception); }
			}
		}
		// The recording the dialog would add: the chosen file, or the last
		// take. null if there's none yet.
		function currentRecording() {
			if ($('#upload-file').checked) return $('#audio-file-input').files[0] || null;
			return recordedAudio;
		}

		$('#start-recording').addEventListener('click', evt => {
			recordAudio();

		});

		// The live view's frequency axis menus.
		$('#live-spectrogram').after(spectrogramControls($('#live-spectrogram'), 'live'));

		function submitAudio() {

			let clip = new Clip();
			let formData = new FormData();

			let transcriptText = $('#transcript').value;
			formData.append('transcript', transcriptText);
			formData.append('referrer', document.referrer);
			formData.append('screen-width', window.screen.width);
			formData.append('screen-height', window.screen.height);
			formData.append('lang', navigator.language || navigator.userLanguage);

			clip.transcript = transcriptText;
			clip.title = $('#title-input').value;
			clip.color = $('#color-select').value;
			clip.tags = parseTags($('#tags-input').value);

			if ($('#upload-file').checked) {
				fileInput = $('#audio-file-input')
				if (fileInput.files.length < 1) return

				let recording = fileInput.files[0];
				formData.append('recording', recording);
				clip.loadAudioFile(recording);

			} else if ($('#record-voice').checked) {
				formData.append('recording', recordedAudio);
				clip.loadAudioFile(recordedAudio);
			} else {
				alert('Please upload a file or make a recording.');
				return;
			}

			$('button.new-clip').classList.add('hidden');
			$('button.new-clip + .spinner').classList.remove('hidden');
			const loadingMessage = $('.loading-message');
			const defaultMessage = loadingMessage.textContent;

			hideModal();

			const analyzeOnServer = () => fetch('./backend.cgi', { method: 'POST', body: formData})
			.then(response => {
				if (!response.ok) throw new Error(response.status);
				// Not every server sends Content-Length (Python's CGI server
				// doesn't), so check the body itself.
				return response.text();
			}).then(text => {
				return text.trim().length < 2 ? {} : JSON.parse(text);
			});

			// Analyse in the browser; if that fails and there's a server that
			// can do it (not in the static build), on the server.
			analyzeInBrowser(formData.get('recording'), transcriptText, text => { loadingMessage.textContent = text; })
			.catch(error => {
				if (!serverAnalysisAvailable) throw error;
				console.warn('In-browser analysis failed, using the server:', error);
				return analyzeOnServer();
			}).then(data => {
				loadingMessage.textContent = defaultMessage;
				$('button.new-clip').classList.remove('hidden');
				$('button.new-clip + .spinner').classList.add('hidden');

				console.assert(data.hasOwnProperty('phones') && data.phones.length < 1);
				
				clip.loadResponse(data);
				globalState.mutate('clips', clips => clips.push(clip));
				clipStore.saveIfWanted(clip);
				globalState.set('playing', false);
				globalState.set('playingClip', clip);
				globalState.set('previewClip', clip);

			}).catch(error => {
				console.error('Failed to process recording:', error);
				const reason = error && error.message && !/^\d+$/.test(error.message) ? ` (${error.message})` : '';
				alert(
					`Sorry, we weren't able to process your recording${reason}. ` +
					"Make sure to speak clearly and ensure " +
					"that your transcript matches the audio. " +
					"For increased chance of success, " +
					"try using short clips with a 1-second period of silence."
				);
				loadingMessage.textContent = defaultMessage;
				$('button.new-clip').classList.remove('hidden');
				$('button.new-clip + .spinner').classList.add('hidden');
			});
		}
	} catch (exception) {
		alert("An unknown error occured.");
		console.error(exception);
	}
	</script>
</section>
