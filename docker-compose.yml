services:
  web:
    build:
      context: .
      # Large conda downloads (kaldi, scipy) drop over Docker's default bridge
      # network on some hosts (notably WSL); building on the host network avoids it.
      network: host
    image: gvv-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount the working tree so local changes are picked up without a rebuild.
      - .:/app
      # Keep each clip's working files (audio, MFA logs, TextGrid) on the host.
      # Must be world-writable: the CGI runs as `nobody`.
      - ./rec:/rec
